        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/Share-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Aggiungi ad aMule Remote
        CURRENT_PROJECT_VERSION: 25
