# XcodeGen spec for the iOS app. Regenerate the project with:  xcodegen generate
name: AmuleRemoteiOS
options:
  bundleIdPrefix: com.sdimambro
targets:
  AmuleRemoteiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AmuleRemote/ECCodes.swift
      - path: Sources/AmuleRemote/ECPacket.swift
      - path: Sources/AmuleRemote/ECClient.swift
      - path: Sources/AmuleRemote/Models.swift
      - path: Sources/AmuleRemote/RemotePrefs.swift
      - path: Sources/AmuleRemote/Keychain.swift
      - path: Sources/AmuleRemote/AppState.swift
      - path: iOS
    settings:
      base:
        PRODUCT_NAME: aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: aMule Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X5SR67A8AL
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
