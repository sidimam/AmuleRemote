          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: X5SR67A8AL
          PROVISIONING_PROFILE_SPECIFIER: aMule Share Mac AppStore

  # Widget «Velocità» e controlli del Centro di Controllo (iOS/iPadOS).
  AmuleRemoteWidgets:
