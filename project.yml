# XcodeGen spec (iOS + watchOS + macOS App Store + visionOS + tvOS).
# Regenerate the project with:  xcodegen generate
name: AmuleRemoteiOS
options:
  bundleIdPrefix: com.sdimambro
  developmentLanguage: it
# Sorgenti condivisi elencati UNO A UNO (la cartella Sources/AmuleRemote
# contiene anche l'interfaccia macOS, che non va compilata altrove).
fileGroups: []
targets:
  AmuleRemoteiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AmuleRemote/ECCodes.swift
      - path: Sources/AmuleRemote/ECPacket.swift
      - path: Sources/AmuleRemote/ECClient.swift
      - path: Sources/AmuleRemote/Models.swift
      - path: Sources/AmuleRemote/RemotePrefs.swift
      - path: Sources/AmuleRemote/Keychain.swift
      - path: Sources/AmuleRemote/AppState.swift
      - path: Sources/AmuleRemote/DemoMode.swift
      - path: Sources/AmuleRemote/Profiles.swift
      - path: Sources/AmuleRemote/AppTheme.swift
      - path: Sources/AmuleRemote/BiometricLock.swift
      - path: Sources/AmuleRemote/Notifier.swift
      - path: Sources/AmuleRemote/BackgroundMonitor.swift
      - path: Sources/AmuleRemote/IconColor.swift
      - path: Sources/AmuleRemote/PasswordField.swift
      - path: Sources/AmuleRemote/OfflineCache.swift
      - path: Sources/AmuleRemote/OfflineBanner.swift
      - path: Sources/AmuleRemote/CloudSync.swift
      - path: Sources/AmuleRemote/QuickActions.swift
      - path: Sources/AmuleRemote/AboutView.swift
      - path: Sources/AmuleRemote/Walkthrough.swift
      - path: Sources/AmuleRemote/SystemSettings.swift
      - path: Sources/AmuleRemote/AppIntentsSupport.swift
      - path: Sources/AmuleRemote/AddLinkSheet.swift
      - path: Sources/AmuleRemote/ServerLists.swift
      - path: Sources/AmuleRemote/ServerListsView.swift
      - path: Sources/AmuleRemote/Continuity.swift
      - path: Sources/AmuleRemote/Ed2kLink.swift
      - path: Localizable.xcstrings
      - path: iOS
      - path: Icons/AppIcon.icon
        type: file
      - path: Icons/AppIcon-blu.icon
        type: file
      - path: Icons/AppIcon-rosso.icon
        type: file
      - path: Icons/AppIcon-arancione.icon
        type: file
      - path: Icons/AppIcon-viola.icon
        type: file
      - path: Icons/AppIcon-teal.icon
        type: file
      - path: Icons/AppIcon-grafite.icon
        type: file
    dependencies:
      - target: AmuleRemoteWatch
      - target: AmuleRemoteShare
      - target: AmuleRemoteWidgets
    # iCloud Key-Value Storage (identificatore FISSO condiviso con il DMG Developer ID,
    # che ha bundle id com.sdimambro.amule-remote) + gruppo keychain condiviso.
    entitlements:
      path: SupportFiles/iOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.sdimambro.amule-remote-ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sdimambro.amule-remote-ios
    settings:
      base:
        PRODUCT_NAME: aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios
        GENERATE_INFOPLIST_FILE: YES
        # Chiavi extra (BGTask, background modes, Face ID) unite a quelle generate.
        INFOPLIST_FILE: SupportFiles/iOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: aMule Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Icone alternative (colori icona nelle Impostazioni avanzate)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-blu AppIcon-rosso AppIcon-arancione AppIcon-viola AppIcon-teal AppIcon-grafite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 25
        MARKETING_VERSION: "1.5"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X5SR67A8AL
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: X5SR67A8AL
          PROVISIONING_PROFILE_SPECIFIER: aMule iOS AppStore
  # Target nativo macOS per il MAC APP STORE (acquisto universale: stesso
  # bundle id dell'app iOS → stessa scheda). Il DMG Developer ID continua a
  # usare la build SPM (swift build) come da README.
  AmuleRemoteMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/AmuleRemote
      - path: Localizable.xcstrings
      - path: Mac
      - path: Icons/AppIcon.icon
        type: file
    dependencies:
      - target: AmuleRemoteShareMac
    entitlements:
      path: SupportFiles/Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.sdimambro.amule-remote-ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sdimambro.amule-remote-ios
    settings:
      base:
        PRODUCT_NAME: aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/Mac-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: aMule Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simone Di Mambro — MIT License"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 25
        MARKETING_VERSION: "1.5"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X5SR67A8AL
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  AmuleRemoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Localizable.xcstrings
      - path: Icons/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_NAME: aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/Watch-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: aMule Remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 25
        MARKETING_VERSION: "1.5"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X5SR67A8AL
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: X5SR67A8AL
          PROVISIONING_PROFILE_SPECIFIER: aMule Watch AppStore
  # Target visionOS (Apple Vision Pro): stessa app, senza il ponte Watch
  # (WatchConnectivity non esiste su visionOS).
  AmuleRemoteVision:
    type: application
    platform: visionOS
    deploymentTarget: "1.0"
    sources:
      - path: Sources/AmuleRemote/ECCodes.swift
      - path: Sources/AmuleRemote/ECPacket.swift
      - path: Sources/AmuleRemote/ECClient.swift
      - path: Sources/AmuleRemote/Models.swift
      - path: Sources/AmuleRemote/RemotePrefs.swift
      - path: Sources/AmuleRemote/Keychain.swift
      - path: Sources/AmuleRemote/AppState.swift
      - path: Sources/AmuleRemote/DemoMode.swift
      - path: Sources/AmuleRemote/Profiles.swift
      - path: Sources/AmuleRemote/AppTheme.swift
      - path: Sources/AmuleRemote/BiometricLock.swift
      - path: Sources/AmuleRemote/Notifier.swift
      - path: Sources/AmuleRemote/BackgroundMonitor.swift
      - path: Sources/AmuleRemote/IconColor.swift
      - path: Sources/AmuleRemote/PasswordField.swift
      - path: Sources/AmuleRemote/OfflineCache.swift
      - path: Sources/AmuleRemote/OfflineBanner.swift
      - path: Sources/AmuleRemote/CloudSync.swift
      - path: Sources/AmuleRemote/QuickActions.swift
      - path: Sources/AmuleRemote/AboutView.swift
      - path: Sources/AmuleRemote/Walkthrough.swift
      - path: Sources/AmuleRemote/SystemSettings.swift
      - path: Sources/AmuleRemote/AppIntentsSupport.swift
      - path: Sources/AmuleRemote/AddLinkSheet.swift
      - path: Sources/AmuleRemote/ServerLists.swift
      - path: Sources/AmuleRemote/ServerListsView.swift
      - path: Sources/AmuleRemote/Continuity.swift
      - path: Sources/AmuleRemote/Ed2kLink.swift
      - path: Localizable.xcstrings
      - path: iOS
        excludes:
          - "WatchBridge.swift"
          - "Assets.xcassets"
      - path: Vision
    entitlements:
      path: SupportFiles/Vision.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.sdimambro.amule-remote-ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sdimambro.amule-remote-ios
    settings:
      base:
        PRODUCT_NAME: aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/iOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: aMule Remote
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-blu AppIcon-rosso AppIcon-arancione AppIcon-viola AppIcon-teal AppIcon-grafite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CURRENT_PROJECT_VERSION: 25
        MARKETING_VERSION: "1.5"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X5SR67A8AL
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: X5SR67A8AL
          PROVISIONING_PROFILE_SPECIFIER: aMule iOS AppStore
  # Target tvOS (Apple TV): stesso motore EC, interfaccia per il telecomando
  # (cartella TV/). Stesso bundle id → stessa scheda App Store (acquisto universale).
  AmuleRemoteTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AmuleRemote/ECCodes.swift
      - path: Sources/AmuleRemote/ECPacket.swift
      - path: Sources/AmuleRemote/ECClient.swift
      - path: Sources/AmuleRemote/Models.swift
      - path: Sources/AmuleRemote/RemotePrefs.swift
      - path: Sources/AmuleRemote/Keychain.swift
      - path: Sources/AmuleRemote/AppState.swift
      - path: Sources/AmuleRemote/DemoMode.swift
      - path: Sources/AmuleRemote/Profiles.swift
      - path: Sources/AmuleRemote/AppTheme.swift
      - path: Sources/AmuleRemote/BiometricLock.swift
      - path: Sources/AmuleRemote/Notifier.swift
      - path: Sources/AmuleRemote/BackgroundMonitor.swift
      - path: Sources/AmuleRemote/IconColor.swift
      - path: Sources/AmuleRemote/PasswordField.swift
      - path: Sources/AmuleRemote/OfflineCache.swift
      - path: Sources/AmuleRemote/OfflineBanner.swift
      - path: Sources/AmuleRemote/CloudSync.swift
      - path: Sources/AmuleRemote/QuickActions.swift
      - path: Sources/AmuleRemote/AboutView.swift
      - path: Sources/AmuleRemote/Walkthrough.swift
      - path: Sources/AmuleRemote/SystemSettings.swift
      - path: Sources/AmuleRemote/AppIntentsSupport.swift
      - path: Sources/AmuleRemote/ServerLists.swift
      - path: Sources/AmuleRemote/ServerListsView.swift
      - path: Sources/AmuleRemote/Continuity.swift
      - path: Sources/AmuleRemote/Ed2kLink.swift
      - path: Localizable.xcstrings
      - path: TV
    entitlements:
      path: SupportFiles/TV.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.sdimambro.amule-remote-ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sdimambro.amule-remote-ios
    settings:
      base:
        PRODUCT_NAME: aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/TV-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: aMule Remote
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "3"
        CURRENT_PROJECT_VERSION: 25
        MARKETING_VERSION: "1.5"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X5SR67A8AL
        TVOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: X5SR67A8AL
          PROVISIONING_PROFILE_SPECIFIER: aMule tvOS AppStore

  # Share Extension «Aggiungi ad aMule Remote» (iOS/iPadOS): link ed2k da Note,
  # Safari, Messaggi… verso il profilo corrente (gruppo keychain condiviso).
  AmuleRemoteShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
      - path: Sources/AmuleRemote/Ed2kLink.swift
      - path: Sources/AmuleRemote/ECCodes.swift
      - path: Sources/AmuleRemote/ECPacket.swift
      - path: Sources/AmuleRemote/ECClient.swift
      - path: Sources/AmuleRemote/Models.swift
      - path: Sources/AmuleRemote/Keychain.swift
      - path: Localizable.xcstrings
    entitlements:
      path: SupportFiles/Share.entitlements
    settings:
      base:
        PRODUCT_NAME: Aggiungi ad aMule Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.amule-remote-ios.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/Share-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Aggiungi ad aMule Remote
        CURRENT_PROJECT_VERSION: 25
        MARKETING_VERSION: "1.5"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: X5SR67A8AL
          PROVISIONING_PROFILE_SPECIFIER: aMule Share iOS AppStore

  # Stessa Share Extension per il Mac App Store.
  AmuleRemoteShareMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
